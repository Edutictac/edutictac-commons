name: Proves del portal i API

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:portal
      - name: Comprovar bundles versionats
        run: git diff --exit-code -- services/portal/public/assets/account-widget.js services/portal/public/assets/rebost-ui.js services/portal/public/assets/teacher-itineraries.js services/portal/public/assets/student-ui.js admin/public/assets/admin-ui.js services/play/public/assets/ui/play-ui.js
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:play

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Preparar dependències de proves
        run: |
          python3 -m venv "$RUNNER_TEMP/commons-tests"
          "$RUNNER_TEMP/commons-tests/bin/python" -m pip install -r tests/requirements-quiosc.txt
      - name: Proves Python amb dades temporals
        run: '"$RUNNER_TEMP/commons-tests/bin/python" -m pytest tests -q'
