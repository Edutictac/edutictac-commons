# Development alias: enables the optional Blocs profile in compose.yml.
# Run with --profile blocs; the portal never depends on this editor.
services:
  blocs:
    profiles: []
    image: ${IMAGE_REGISTRY:-edutictac}/commons-blocs:${BLOCS_TAG:-local}
  id-api:
    environment:
      COMMONS_MODULE_PROFILES: ${COMPOSE_PROFILES:-play},blocs
    restart: unless-stopped
  recursos-api:
    restart: unless-stopped
  recursos:
    restart: unless-stopped
  portal:
    restart: unless-stopped
