<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Còpia de services/portal/public/assets/theme-preference.js (vegeu tests/test_shared_assets.py). -->
  <script src="./theme-preference.js"></script>
  <meta name="theme-color" content="#176b5c">
  <title>EduTicTac Play</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="playApp"><p role="status">Carregant / Cargando / Loading…</p></div>
  <script type="module" src="./app.js"></script>
  <script>if ('serviceWorker' in navigator) { let refreshing = false; const hadController = !!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadController || refreshing) return; refreshing = true; location.reload(); }); window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((registration) => { registration.update(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') registration.update(); }); }).catch(() => {})); }</script>
</body>
</html>
