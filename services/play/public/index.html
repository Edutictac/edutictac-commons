<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b5c">
  <title>EduTicTac Play</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="./">EduTicTac Play</a><label class="language"><span data-i18n="language">Idioma</span><select id="language"><option value="es">ES</option><option value="ca">CA</option><option value="en">EN</option></select></label></header>
  <main class="shell">
    <section id="home" class="panel hero"><p class="eyebrow">EduTicTac Commons</p><h1 data-i18n="homeTitle">Crea un juego educativo</h1><p data-i18n="homeIntro">Elige un tipo y empieza con una actividad sencilla.</p><div class="type-grid"><button class="type-card" data-type="multiple-choice"><span class="type-icon">✓</span><strong data-i18n="multipleChoice">Quiz</strong><small data-i18n="multipleChoiceHelp">Pregunta con varias respuestas</small></button><button class="type-card" data-type="true-false"><span class="type-icon">¿?</span><strong data-i18n="trueFalse">Verdadero/Falso</strong><small data-i18n="trueFalseHelp">Una afirmación para comprobar</small></button><button class="type-card" data-type="memory"><span class="type-icon">▦</span><strong data-i18n="memory">Memory</strong><small data-i18n="memoryHelp">Encuentra las parejas</small></button><button class="type-card" data-type="matching"><span class="type-icon">↔</span><strong data-i18n="matching">Relacionar</strong><small data-i18n="matchingHelp">Une cada concepto</small></button></div></section>
    <section id="editor" class="panel hidden" aria-labelledby="editorTitle"><div class="section-heading"><div><p class="eyebrow">EduTicTac Play</p><h1 id="editorTitle" data-i18n="editorTitle">Crea tu quiz</h1></div><button id="backHome" class="button secondary" data-i18n="back">Volver</button></div><form id="activityForm" novalidate><label><span data-i18n="title">Título</span><input id="title" maxlength="200" required data-i18n-placeholder="titlePlaceholder" placeholder="Ej.: Animales del bosque"></label><label><span data-i18n="question">Descripción</span><textarea id="question" maxlength="2000" required data-i18n-placeholder="questionPlaceholder" placeholder="Ej.: Vocabulario de animales"></textarea></label><fieldset id="answersField"><legend data-i18n="answers">Respuestas</legend><div id="answers"></div><button id="addAnswer" type="button" class="button secondary" data-i18n="addAnswer">+ Añadir respuesta</button></fieldset><fieldset id="truthField" class="hidden"><legend data-i18n="correctAnswer">Respuesta correcta</legend><label class="choice"><input id="correctTrue" type="radio" name="truth" value="true" checked><span data-i18n="true">Verdadero</span></label><label class="choice"><input id="correctFalse" type="radio" name="truth" value="false"><span data-i18n="false">Falso</span></label></fieldset><fieldset id="memoryField" class="hidden"><legend data-i18n="pairs">Parejas</legend><div id="cards"></div><button id="addCard" type="button" class="button secondary" data-i18n="addPair">+ Añadir pareja</button></fieldset><fieldset id="matchingField" class="hidden"><legend data-i18n="relations">Relaciones</legend><div id="matches"></div><button id="addMatch" type="button" class="button secondary" data-i18n="addRelation">+ Añadir relación</button></fieldset><p id="formError" class="error" role="alert"></p><div class="actions"><button id="preview" type="submit" class="button" data-i18n="preview">Previsualizar</button><button id="save" type="button" class="button secondary" data-i18n="save">Guardar</button></div></form></section>
    <section id="previewPanel" class="panel hidden" aria-labelledby="previewTitle"><div class="section-heading"><div><p class="eyebrow" data-i18n="previewEyebrow">Vista previa</p><h1 id="previewTitle"></h1></div><button id="edit" class="button secondary" data-i18n="edit">Editar</button></div><div id="player"></div><div id="previewActions" class="actions"><button id="savePreview" class="button" data-i18n="save">Guardar</button><span data-i18n="previewOnly">Esta es una previsualización.</span></div><div id="savedActions" class="actions hidden"><a id="download" class="button" data-i18n="download">Descargar como H5P</a><button id="copy" class="button secondary" data-i18n="copy">Copiar enlace</button><span id="savedMessage" role="status"></span></div></section>
  </main>
  <script src="./app.js"></script>
  <script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));</script>
</body>
</html>
