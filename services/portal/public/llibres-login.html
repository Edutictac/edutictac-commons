<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"><script src="/assets/theme-preference.js"></script>
    <title>EduTicTac Llibres · Acceso</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/assets/account-widget.css">
    <script src="/llibres-login.js" defer></script>
    <!-- Després de llibres-login.js, que fixa l'idioma de la pestanya. -->
    <script src="/assets/account-widget.js" defer></script>
    <link rel="stylesheet" href="/assets/edutictac-footer.css">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-actions"><edutictac-account id="accountWidget"></edutictac-account></div>
    </header>
    <main class="single-layout">
      <section class="panel" aria-live="polite">
        <p class="eyebrow">EduTicTac Llibres</p>
        <h1 id="login-title">Comprobando acceso…</h1>
        <p id="login-message"></p>
        <a id="login-retry" hidden>Entrar con cuenta docente</a>
        <button id="login-close" type="button">Cerrar esta pestaña y volver al libro</button>
      </section>
    </main>

    <footer class="ett-footer ett-footer--page">
      <p class="ett-footer__id">
        <span class="ett-footer__brand">EduTicTac</span>
        <span aria-hidden="true">·</span>
        <span class="ett-footer__service">Commons</span>
        <span class="ett-footer__version">v0.1.1-beta2</span>
      </p>
      <div class="ett-footer__links">
        <a href="/">Inicio</a>
        <a href="/privacy.html">Privacidad</a>
        <a href="https://git.edutictac.es/Edutictac/edutictac-commons">Código fuente</a>
        <a href="https://git.edutictac.es/Edutictac/edutictac-commons/src/branch/main/LICENSE">AGPL-3.0</a>
      </div>
    </footer>

  </body>
</html>
