<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1"><script src="/assets/theme-preference.js"></script>
    <title data-i18n="student.pageTitle">Tauler d'alumnat — EduTicTac Commons</title>
    <script src="/deployment.js"></script>
    <script src="/assets/language-preference.js"></script>
    <script src="/i18n.js"></script>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/assets/account-widget.css">
    <script src="/assets/account-widget.js" defer></script>
    <link rel="stylesheet" href="/beta-notice.css">
    <script src="/beta-notice.js" defer></script>
    <link rel="stylesheet" href="/assets/edutictac-footer.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand-lockup">
        <img src="/commons-mark.svg" alt="" width="46" height="46">
        <div>
          <p class="eyebrow">EduTicTac Commons</p>
          <h1 data-i18n="student.title">Tauler d'alumnat</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <edutictac-account id="accountWidget"></edutictac-account>
      </div>
    </header>

    <main class="single-layout">
      <section class="role-area student-area" aria-labelledby="studentTitle">
        <div class="role-heading">
          <p class="eyebrow" data-i18n="common.students">Alumnat</p>
          <h2 id="studentTitle" data-i18n="student.subtitle">Recorregut i activitat</h2>
        </div>

        <p><a id="llibresHomeLink" class="button-link secondary" hidden>EduTicTac Llibres</a></p>

        <div class="panel">
          <div id="studentPanel"></div>
        </div>
      </section>
    </main>

    <footer class="ett-footer ett-footer--page">
      <p class="ett-footer__id">
        <span class="ett-footer__brand">EduTicTac</span>
        <span aria-hidden="true">·</span>
        <span class="ett-footer__service">Commons</span>
        <span class="ett-footer__version">v0.1.1-beta6.4-candidate1</span>
      </p>
      <div class="ett-footer__links">
        <a href="/" data-i18n="footer.home">Inici</a>
        <a href="/privacy.html" data-i18n="footer.privacy">Privacitat</a>
        <a href="https://git.edutictac.es/Edutictac/edutictac-commons" data-i18n="footer.source">Codi font</a>
        <a href="https://git.edutictac.es/Edutictac/edutictac-commons/src/branch/main/LICENSE">AGPL-3.0</a>
      </div>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
