<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tauler d'alumnat — EduTicTac Commons</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">EduTicTac Commons</p>
        <h1>Tauler d'alumnat</h1>
      </div>
      <nav class="topnav" aria-label="Navegació principal">
        <a href="/">Inici</a>
      </nav>
      <span id="apiStatus" class="status">Comprovant API...</span>
    </header>

    <main class="single-layout">
      <section class="role-area student-area" aria-labelledby="studentTitle">
        <div class="role-heading">
          <p class="eyebrow">Alumnat</p>
          <h2 id="studentTitle">Recorregut i activitat</h2>
        </div>

        <div class="panel">
          <div class="panel-heading">
            <p class="eyebrow">Accés</p>
            <h3>Entrar amb codi + PIN</h3>
          </div>

          <div class="grid-fields">
            <label>
              Codi públic
              <input id="studentCode" type="text" maxlength="3" placeholder="K7P">
            </label>
            <label>
              PIN
              <input id="studentPin" type="text" inputmode="numeric" maxlength="6" placeholder="1234">
            </label>
          </div>

          <div class="actions">
            <button id="studentLogin" type="button">Entrar com a alumne</button>
            <button id="studentLogout" type="button" class="secondary">Sortir</button>
          </div>

          <div id="studentOutput" class="output empty">Usa una credencial generada pel docent.</div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
