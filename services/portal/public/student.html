<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="student.pageTitle">Tauler d'alumnat — EduTicTac Commons</title>
    <script src="/deployment.js"></script>
    <script src="/assets/language-preference.js"></script>
    <script src="/i18n.js"></script>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/assets/account-widget.css">
    <script src="/assets/account-widget.js" defer></script>
    <link rel="stylesheet" href="/beta-notice.css">
    <script src="/beta-notice.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand-lockup">
        <img src="/commons-mark.svg" alt="" width="46" height="46">
        <div>
          <p class="eyebrow">EduTicTac Commons</p>
          <h1 data-i18n="student.title">Tauler d'alumnat</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <edutictac-account id="accountWidget"></edutictac-account>
        <div class="lang-switcher" role="group" aria-label="Idioma" data-i18n-title="common.lang.label">
          <button type="button" data-lang="ca" title="Català">CA</button>
          <button type="button" data-lang="va" title="Valencià">VA</button>
          <button type="button" data-lang="es" title="Español">ES</button>
          <button type="button" data-lang="en" title="English">EN</button>
        </div>
      </div>
    </header>

    <main class="single-layout">
      <section class="role-area student-area" aria-labelledby="studentTitle">
        <div class="role-heading">
          <p class="eyebrow" data-i18n="common.students">Alumnat</p>
          <h2 id="studentTitle" data-i18n="student.subtitle">Recorregut i activitat</h2>
        </div>

        <p><a id="llibresHomeLink" class="button-link secondary" hidden>EduTicTac Llibres</a></p>

        <div class="panel">
          <div id="studentPanel"></div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
