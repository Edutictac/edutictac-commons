# Optional module; Docker DNS resolves only when a request arrives.
location = /blocs/status {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    set $modules_upstream http://id-api:8005;
    proxy_pass $modules_upstream/api/modules/status;
}
location = /blocs { return 302 /blocs-access.html; }
location = /blocs/ { return 302 /blocs-access.html; }
location ^~ /blocs/ {
    set $blocs_upstream http://blocs:8080;
    rewrite ^/blocs/(.*)$ /$1 break;
    proxy_intercept_errors on;
    error_page 502 503 504 =302 /blocs-access.html;
    proxy_pass $blocs_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
}
# The existing Blocs build uses /static for imported media. The editor's JS,
# runtime config, templates and Scratch proxy remain under /blocs/.
location ^~ /static/ {
    set $blocs_upstream http://blocs:8080;
    proxy_intercept_errors on;
    error_page 502 503 504 =302 /blocs-access.html;
    proxy_pass $blocs_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
}
