# Loaded inside the portal server only by compose.rebost-blocs.yml.
location = /blocs/status {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"enabled":true}';
}
location = /blocs { return 302 /blocs-access.html; }
location = /blocs/ { return 302 /blocs-access.html; }
location ^~ /blocs/ {
    set $blocs_upstream http://blocs:8080;
    rewrite ^/blocs/(.*)$ /$1 break;
    proxy_pass $blocs_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
}
# The existing Blocs build uses /static for imported media. The editor's JS,
# runtime config, templates and Scratch proxy remain under /blocs/.
location ^~ /static/ {
    set $blocs_upstream http://blocs:8080;
    proxy_pass $blocs_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
}
