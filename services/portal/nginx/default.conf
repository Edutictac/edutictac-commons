server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://id-api:8005/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Recursos és opcional. La variable evita que nginx intente resolver el
    # servicio quan el perfil Compose no està actiu.
    resolver 127.0.0.11 valid=30s;
    location /resources-api/ {
        set $recursos_upstream http://recursos-api:8004;
        rewrite ^/resources-api/(.*)$ /api/$1 break;
        proxy_pass $recursos_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El portal es una demo que se actualiza con frecuencia. Evita que los
    # navegadores conserven app.js/i18n.js de una versión anterior.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
