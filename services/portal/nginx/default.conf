server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Totes les rutes proxiades usen una variable en el proxy_pass (en lloc
    # d'un hostname literal) perquè nginx la resolga amb el `resolver` de
    # Docker en cada petició. Sense això, quan una actualitzacio/rollback
    # recrea id-api o admin (IP nova en la xarxa Docker), nginx quedaria
    # apuntant a la IP vella fins que algu reinicia el propi portal a ma.
    resolver 127.0.0.11 valid=30s;

    # Optional editors mounted by a Compose override; no route when absent.
    include /etc/nginx/commons-editors/*.conf;
    include /etc/nginx/blocs.locations.conf;

    location /api/quiosc/ {
        set $quiosc_upstream http://id-api:8005;
        proxy_pass $quiosc_upstream;
        proxy_read_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location /api/llibres/ {
        client_max_body_size 30m;
        set $llibres_upstream http://id-api:8005;
        proxy_pass $llibres_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }

    location /api/assets/v1/ {
        client_max_body_size 5m;
        set $rebost_upstream http://id-api:8005;
        proxy_pass $rebost_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "private, no-store" always;
    }

    # Only classroom file collections accept the larger streaming request body.
    location ~ ^/api/(teacher/groups/[^/]+/files|student/group-files)$ {
        client_max_body_size 110m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        set $files_upstream http://id-api:8005;
        proxy_pass $files_upstream;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-store" always;
    }
    # Rutes internes entre serveis (p. ex. resolució de sessió per al Banc): mai des del navegador.
    location ^~ /api/internal/ { return 404; }

    location /api/ {
        client_max_body_size 1m;
        set $id_api_upstream http://id-api:8005;
        proxy_pass $id_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # El panell tècnic només s'ha d'usar des del mateix servidor, la Tailnet o
    # un túnel SSH. El portal el proxyja perquè el navegador puga completar el
    # login OIDC al mateix origen, però es denega la LAN. Les connexions fetes
    # des del host a un port publicat per Docker arriben amb la IP de la xarxa
    # Docker (172.16.0.0/12); les de Tailscale, amb 100.64.0.0/10.
    location /admin/api/ {
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;
        allow 100.64.0.0/10;
        allow fd7a:115c:a1e0::/48;
        deny all;
        set $admin_upstream http://admin:8091;
        rewrite ^/admin/api/(.*)$ /api/$1 break;
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /admin/ {
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;
        allow 100.64.0.0/10;
        allow fd7a:115c:a1e0::/48;
        deny all;
        set $admin_upstream http://admin:8091;
        rewrite ^/admin/(.*)$ /$1 break;
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /resources-api/ {
        set $recursos_upstream http://recursos-api:8004;
        rewrite ^/resources-api/(.*)$ /api/$1 break;
        proxy_pass $recursos_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El portal es una demo que se actualiza con frecuencia. Evita que los
    # navegadores conserven app.js/i18n.js de una versión anterior.
    location ~ /\. { return 404; }

    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    }
}
