# Host-network profile for the public VPS. No Docker socket or host administration.
map $http_x_forwarded_proto $commons_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 127.0.0.1:8180;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    location = /quiosc.html { return 404; }
    location ^~ /api/quiosc/ { return 404; }
    location ^~ /api/setup/ { return 404; }
    location = /api/teacher/login { return 404; }
    # Rutes internes entre serveis: només per la xarxa interna, mai des de fora.
    location ^~ /api/internal/ { return 404; }

    location /api/ {
        client_max_body_size 30m;
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $commons_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        add_header Cache-Control "private, no-store" always;
    }

    # Public catalogue and existing bank permissions; no write/admin API proxy.
    location = /resources-api/resources {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8004/api/resources;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }
    location = /resources-api/teacher/favorites {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8004/api/teacher/favorites;
        proxy_set_header Host $host;
        add_header Cache-Control "private, no-store" always;
    }
    location /resources-api/ { return 404; }

    location ~ /\. { return 404; }
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/ =404;
    }
}
