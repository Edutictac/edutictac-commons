# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1

metadata:
  name: EduTicTac Commons
  labels:
    blueprints.goauthentik.io/instantiate: "true"
    blueprints.goauthentik.io/description: "OIDC de EduTicTac Commons"

entries:
  - id: edutictac-admin-group
    model: authentik_core.group
    state: present
    identifiers:
      name: administrador

  - id: edutictac-teacher-group
    model: authentik_core.group
    state: present
    identifiers:
      name: profesor
    attrs:
      name: profesor

  - id: edutictac-commons-groups-mapping
    model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      name: EduTicTac Commons groups
    attrs:
      name: EduTicTac Commons groups
      scope_name: groups
      expression: |
        return {
            "groups": [group.name for group in request.user.ak_groups.all()],
        }
      description: EduTicTac Commons role groups

  - id: edutictac-commons-provider
    model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: EduTicTac Commons OIDC
    attrs:
      name: EduTicTac Commons OIDC
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env EDUTICTAC_ID_OIDC_CLIENT_ID
      client_secret: !Env EDUTICTAC_ID_OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
      issuer_mode: per_provider
      include_claims_in_id_token: true
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
      redirect_uris:
        - url: !Env EDUTICTAC_ID_OIDC_REDIRECT_URL
          matching_mode: strict

  - id: edutictac-commons-application
    model: authentik_core.application
    state: present
    identifiers:
      slug: edutictac-commons
    attrs:
      name: EduTicTac Commons
      slug: edutictac-commons
      provider: !KeyOf edutictac-commons-provider
      policy_engine_mode: any

  - model: authentik_core.user
    state: present
    identifiers:
      username: akadmin
    attrs:
      groups:
        - !KeyOf edutictac-admin-group
