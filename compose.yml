services:
  id-api:
    image: ${IMAGE_REGISTRY:-edutictac}/commons-id-api:${IMAGE_TAG:-0.1.1-alpha}
    build:
      context: ./services/id-api
      # BuildKit puede heredar un DNS aislado que no resuelve PyPI en algunos
      # hosts; la red del host solo se usa durante la construcción.
      network: host
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      EDUTICTAC_ID_DB: ${EDUTICTAC_ID_DB:-/data/id.db}
      EDUTICTAC_ID_SECRET: ${EDUTICTAC_ID_SECRET:-change-this-local-secret}
      EDUTICTAC_ID_TEACHER_TOKEN: ${EDUTICTAC_ID_TEACHER_TOKEN:-dev-teacher}
      EDUTICTAC_ID_APP_TOKEN: ${EDUTICTAC_ID_APP_TOKEN:-dev-app-token}
      EDUTICTAC_RESOURCES_API_URL: http://recursos-api:8004
      EDUTICTAC_SETUP_TOKEN: ${EDUTICTAC_SETUP_TOKEN:-}
      EDUTICTAC_AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      EDUTICTAC_ID_COOKIE_SECURE: ${EDUTICTAC_ID_COOKIE_SECURE:-0}
      EDUTICTAC_ID_PIN_HASH_ITERATIONS: ${EDUTICTAC_ID_PIN_HASH_ITERATIONS:-60000}
      EDUTICTAC_ID_OIDC_ISSUER_URL: ${EDUTICTAC_ID_OIDC_ISSUER_URL:-}
      EDUTICTAC_ID_OIDC_DISCOVERY_URL: ${EDUTICTAC_ID_OIDC_DISCOVERY_URL:-}
      EDUTICTAC_ID_OIDC_AUTHORIZATION_URL: ${EDUTICTAC_ID_OIDC_AUTHORIZATION_URL:-}
      EDUTICTAC_ID_OIDC_CLIENT_ID: ${EDUTICTAC_ID_OIDC_CLIENT_ID:-}
      EDUTICTAC_ID_OIDC_CLIENT_SECRET: ${EDUTICTAC_ID_OIDC_CLIENT_SECRET:-}
      EDUTICTAC_ID_OIDC_REDIRECT_URL: ${EDUTICTAC_ID_OIDC_REDIRECT_URL:-}
      EDUTICTAC_ID_OIDC_SCOPES: ${EDUTICTAC_ID_OIDC_SCOPES:-openid profile}
      EDUTICTAC_ID_OIDC_ROLE_CLAIM: ${EDUTICTAC_ID_OIDC_ROLE_CLAIM:-groups}
    volumes:
      - ./data:/data
    expose:
      - "8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  portal:
    image: ${IMAGE_REGISTRY:-edutictac}/commons-portal:${IMAGE_TAG:-0.1.1-alpha}
    build:
      context: ./services/portal
    depends_on:
      id-api:
        condition: service_healthy
    ports:
      - "${PORTAL_PORT:-8082}:80"

  play:
    image: ${IMAGE_REGISTRY:-edutictac}/commons-play:${IMAGE_TAG:-0.1.1-alpha}
    build:
      context: ./services/play
    environment:
      PORT: 8083
      PLAY_DATA_DIR: /app/data
      EDUTICTAC_ID_API_URL: http://id-api:8005
      EDUTICTAC_ID_APP_TOKEN: ${EDUTICTAC_ID_APP_TOKEN:-dev-app-token}
      EDUTICTAC_PLAY_APP_ID: edutictac-play
      RECURSOS_API_URL: ${RECURSOS_API_URL:-}
      PLAY_INGEST_TOKEN: ${PLAY_INGEST_TOKEN:-}
      PLAY_PUBLIC_URL: ${PLAY_PUBLIC_URL:-}
      PLAY_DEFAULT_VISIBILITY: ${PLAY_DEFAULT_VISIBILITY:-public}
      PLAY_ANONYMOUS_TTL_SECONDS: ${PLAY_ANONYMOUS_TTL_SECONDS:-86400}
      PLAY_TRUSTED_IDENTITY_HEADER: ${PLAY_TRUSTED_IDENTITY_HEADER:-}
      PLAY_CONTROLLED_CATALOG: ${PLAY_CONTROLLED_CATALOG:-1}
    volumes:
      - ./data/play:/app/data
    ports:
      - "${PLAY_PORT:-8084}:8083"
    depends_on:
      id-api:
        condition: service_healthy

  recursos-api:
    image: ${IMAGE_REGISTRY:-edutictac}/recursos-api:${RECURSOS_TAG:-local}
    build:
      context: ../recursos-api
      network: host
    profiles: ["recursos"]
    environment:
      RECURSOS_DB: /data/recursos.db
      RECURSOS_DOCUMENTS_DIR: /data/documents
      RECURSOS_DOCUMENTS_MAX_BYTES: ${RECURSOS_DOCUMENTS_MAX_BYTES:-26214400}
      RECURSOS_SECRET: ${RECURSOS_SECRET:-local-recursos-secret}
      RECURSOS_COOKIE_SECURE: ${RECURSOS_COOKIE_SECURE:-0}
      RECURSOS_APP_URL: ${RECURSOS_APP_URL:-http://localhost:8086}
      PLAY_INGEST_TOKEN: ${PLAY_INGEST_TOKEN:-local-play-ingest-token}
      EDUHOOT_RESOURCES_URL: ${EDUHOOT_RESOURCES_URL:-http://eduhoot:3000}
      EDUHOOT_BASE_URL: ${EDUHOOT_PUBLIC_BASE_URL:-http://localhost:8090}
      EDUHOOT_LOCAL_CATALOG: "1"
      EDUHOOT_RESOURCES_TOKEN: ${EDUHOOT_RESOURCES_TOKEN:-local-eduhoot-resources-token}
      PLAY_ALLOWED_HOSTS: ${PLAY_ALLOWED_HOSTS:-play.local.test,localhost}
      EDUTICTAC_ID_API_URL: http://id-api:8005
      EDUTICTAC_ID_APP_TOKEN: ${EDUTICTAC_ID_APP_TOKEN:-dev-app-token}
      OIDC_ISSUER: ${EDUTICTAC_ID_OIDC_ISSUER_URL:-}
      OIDC_DISCOVERY_URL: ${EDUTICTAC_ID_OIDC_DISCOVERY_URL:-}
      OIDC_AUTHORIZATION_URL: ${EDUTICTAC_ID_OIDC_AUTHORIZATION_URL:-}
      OIDC_CLIENT_ID: ${EDUTICTAC_ID_OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${EDUTICTAC_ID_OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${RECURSOS_OIDC_REDIRECT_URI:-}
      OIDC_SCOPE: ${RECURSOS_OIDC_SCOPE:-openid profile}
      OIDC_ADMIN_EMAILS: ${RECURSOS_OIDC_ADMIN_EMAILS:-}
      RESOURCES_IMPORT_TOKEN: ${RESOURCES_IMPORT_TOKEN:-}
    volumes:
      - ./data/recursos-api:/data
    expose:
      - "8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      id-api:
        condition: service_healthy

  recursos:
    image: ${IMAGE_REGISTRY:-edutictac}/recursos:${RECURSOS_TAG:-local}
    build:
      context: ../recursos
    profiles: ["recursos"]
    ports:
      - "${RECURSOS_PORT:-8086}:80"
    depends_on:
      recursos-api:
        condition: service_healthy

  admin:
    image: ${IMAGE_REGISTRY:-edutictac}/commons-admin:${ADMIN_TAG:-${IMAGE_TAG:-0.1.1-alpha}}
    build:
      context: .
      dockerfile: admin/Dockerfile
      # host: evita fallades de resolucio DNS durant "apt-get update" en hosts
      # amb un resolver local (p.ex. NetworkManager+dnsmasq en 127.0.0.1)
      network: host
    # systemctl --user resol el PID del manager d'usuari del host (l'altre
    # extrem del socket privat de systemd) via SO_PEERCRED. Sense compartir
    # l'espai de noms de PID del host, eixe procés es invisible des del
    # contenidor i el kernel torna pid=0, que systemd tracta com a
    # credencial invalida ("Failed to connect... No data available").
    # Nomes dona visibilitat de la llista de processos del host (sense
    # ptrace ni cap altra capacitat nova).
    pid: host
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      REPO_DIR: ${PWD}
      XDG_RUNTIME_DIR: /run/user/${PUID:-1000}
      XDG_CONFIG_HOME: /hostcfg
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      IMAGE_REGISTRY: ${IMAGE_REGISTRY:-edutictac}
      IMAGE_TAG: ${IMAGE_TAG:-0.1.1-alpha}
      EDUHOOT_TAG: ${EDUHOOT_TAG:-1.0.2}
      UPDATE_CHANNEL: ${UPDATE_CHANNEL:-testing}
      REGISTRY_USERNAME: ${REGISTRY_USERNAME:-}
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD:-}
      PORTAL_HEALTH_URL: http://portal/api/health
      ID_API_HEALTH_URL: http://id-api:8005/api/health
      ID_API_ME_URL: http://id-api:8005/api/auth/me
      ADMIN_OIDC_USERNAME: ${ADMIN_OIDC_USERNAME:-akadmin}
      AUTHENTIK_API_URL: ${AUTHENTIK_API_URL:-http://authentik-server:9000/api/v3}
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN:-}
      AUTHENTIK_TEACHER_GROUP: ${AUTHENTIK_TEACHER_GROUP:-profesor}
      CONTENT_CATALOG_BASE_URL: ${CONTENT_CATALOG_BASE_URL:-}
      CONTENT_SYNC_DIR: /app/content-sync
      EDUHOOT_API_URL: http://eduhoot:3000
      EDUHOOT_RESOURCES_TOKEN: ${EDUHOOT_RESOURCES_TOKEN:-}
      RESOURCES_API_URL: http://recursos-api:8004
      RESOURCES_IMPORT_TOKEN: ${RESOURCES_IMPORT_TOKEN:-}
    volumes:
      - /run/user/${PUID:-1000}/bus:/run/user/${PUID:-1000}/bus
      # systemctl --user parla amb el manager per un socket local directe
      # (XDG_RUNTIME_DIR/systemd/private), no nomes pel bus de sessio.
      - /run/user/${PUID:-1000}/systemd:/run/user/${PUID:-1000}/systemd
      # sd_booted(): "enable --now" es nega si no detecta que el sistema
      # (no nomes la sessio d'usuari) arranca amb systemd. Nomes lectura,
      # es un directori marcador buit, no dona cap privilegi nou.
      - /run/systemd/system:/run/systemd/system:ro
      - ${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user:/hostcfg/systemd/user
      - ./backups:/app/backups
      - ./data:/app/data:ro
      - ./data/content-sync:/app/content-sync
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8091}:8091"
    depends_on:
      id-api:
        condition: service_healthy

  eduhoot-mongo:
    image: mongo:7
    profiles: ["eduhoot"]
    volumes:
      - ./data/eduhoot-mongo:/data/db
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  eduhoot:
    image: ${IMAGE_REGISTRY:-edutictac}/eduhoot:${EDUHOOT_TAG:-1.0.2}
    profiles: ["eduhoot"]
    depends_on:
      eduhoot-mongo:
        condition: service_healthy
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      MONGO_URL: mongodb://eduhoot-mongo:27017/eduhoot
      EDUTICTAC_ID_API_URL: http://id-api:8005
      EDUTICTAC_ID_APP_TOKEN: ${EDUTICTAC_ID_APP_TOKEN:-dev-app-token}
      EDUTICTAC_ID_AUTH_REQUIRED: ${EDUHOOT_ID_AUTH_REQUIRED:-1}
      AUTHENTIK_ISSUER: ${EDUHOOT_AUTHENTIK_ISSUER:-}
      AUTHENTIK_DISCOVERY_URL: ${EDUHOOT_AUTHENTIK_DISCOVERY_URL:-}
      AUTHENTIK_AUTHORIZATION_URL: ${EDUHOOT_AUTHENTIK_AUTHORIZATION_URL:-}
      AUTHENTIK_TOKEN_URL: ${EDUHOOT_AUTHENTIK_TOKEN_URL:-}
      AUTHENTIK_USERINFO_URL: ${EDUHOOT_AUTHENTIK_USERINFO_URL:-}
      AUTHENTIK_CLIENT_ID: ${EDUHOOT_AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${EDUHOOT_AUTHENTIK_CLIENT_SECRET:-}
      AUTHENTIK_REDIRECT_URI: ${EDUHOOT_AUTHENTIK_REDIRECT_URI:-}
      AUTHENTIK_SCOPE: ${EDUHOOT_AUTHENTIK_SCOPE:-openid profile email groups}
      AUTHENTIK_ROLE_CLAIM: ${EDUHOOT_AUTHENTIK_ROLE_CLAIM:-groups}
      AUTHENTIK_TEACHER_ROLES: ${EDUHOOT_AUTHENTIK_TEACHER_ROLES:-profesor,teacher,docente,administrador,admin}
      AUTHENTIK_ONLY: ${EDUHOOT_AUTHENTIK_ONLY:-1}
      PUBLIC_BASE_URL: ${EDUHOOT_PUBLIC_BASE_URL:-http://localhost:${EDUHOOT_PORT:-8090}}
      PUBLIC_IMPORT_SOURCE_URL: ${EDUHOOT_PUBLIC_IMPORT_SOURCE:-https://eduhoot.edutictac.es}
      EDUHOOT_RESOURCES_TOKEN: ${EDUHOOT_RESOURCES_TOKEN:-local-eduhoot-resources-token}
    volumes:
      - ./data/eduhoot-uploads:/app/public/uploads
      - ./data/eduhoot-logs:/app/logs
    ports:
      - "${EDUHOOT_PORT:-8090}:3000"

  authentik-postgresql:
    image: postgres:16-alpine
    profiles: ["authentik"]
    environment:
      POSTGRES_DB: ${AUTHENTIK_PG_DB:-authentik}
      POSTGRES_USER: ${AUTHENTIK_PG_USER:-authentik}
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASS:-change-this-authentik-db-password}
    volumes:
      - authentik_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  authentik-server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.3}
    profiles: ["authentik"]
    command: server
    depends_on:
      authentik-postgresql:
        condition: service_healthy
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS:-change-this-authentik-db-password}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change-this-authentik-secret-key}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    ports:
      - "${AUTHENTIK_PORT:-9000}:9000"
      - "${AUTHENTIK_HTTPS_PORT:-9443}:9443"
    shm_size: 512mb
    volumes:
      - ./data/authentik:/data
      - ./data/authentik-templates:/templates
    restart: unless-stopped

  authentik-worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.3}
    profiles: ["authentik"]
    command: worker
    depends_on:
      authentik-postgresql:
        condition: service_healthy
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS:-change-this-authentik-db-password}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change-this-authentik-secret-key}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@edutictac.local}
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN:-}
      EDUTICTAC_ID_OIDC_CLIENT_ID: ${EDUTICTAC_ID_OIDC_CLIENT_ID:-}
      EDUTICTAC_ID_OIDC_CLIENT_SECRET: ${EDUTICTAC_ID_OIDC_CLIENT_SECRET:-}
      EDUTICTAC_ID_OIDC_REDIRECT_URL: ${EDUTICTAC_ID_OIDC_REDIRECT_URL:-}
      RECURSOS_OIDC_REDIRECT_URI: ${RECURSOS_OIDC_REDIRECT_URI:-}
      EDUHOOT_AUTHENTIK_REDIRECT_URI: ${EDUHOOT_AUTHENTIK_REDIRECT_URI:-}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - ./data/authentik:/data
      - ./data/authentik-templates:/templates
      - ./authentik-blueprints/edutictac-commons.yaml:/blueprints/edutictac-commons.yaml:ro
    restart: unless-stopped

volumes:
  authentik_database:
    driver: local
