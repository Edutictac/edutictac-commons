services:
  portal:
    # The public TLS ingress is the only listener on 80/443; keep the portal
    # reachable only from the host loopback for diagnostics.
    ports: !override
      - "127.0.0.1:${PORTAL_PORT:-8082}:80"

  ingress:
    image: caddy:2-alpine
    depends_on:
      portal:
        condition: service_started
    ports:
      - "${INGRESS_HTTP_PORT:-80}:80"
      - "${INGRESS_HTTPS_PORT:-443}:443"
    environment:
      COMMONS_INGRESS_HOST: ${COMMONS_INGRESS_HOST:-edutictac.local}
    volumes:
      - ${INGRESS_CADDYFILE:-./services/ingress/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
